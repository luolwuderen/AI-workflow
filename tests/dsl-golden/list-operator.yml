app:
  name: List Operator
  description: List sorting and limiting round trip.
  icon: 🤖
  icon_background: '#E0F2FE'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        position: {x: 80, y: 160}
        data:
          desc: ''
          title: User Input
          type: start
          selected: false
          variables:
            - variable: items
              label: Items
              type: json
              required: true
              default: []
      - id: list
        type: custom
        position: {x: 360, y: 160}
        data:
          desc: ''
          title: List Operator
          type: list-operator
          selected: false
          variable: [start, items]
          extract_by:
            enabled: false
            serial: 0
          order_by:
            enabled: true
            value: desc
            var: score
          limit:
            enabled: true
            size: 5
      - id: end
        type: custom
        position: {x: 640, y: 160}
        data:
          desc: ''
          title: Output
          type: end
          selected: false
          outputs:
            - variable: result
              value_selector: [list, output]
    edges:
      - id: edge-start-list
        type: custom
        source: start
        sourceHandle: source
        target: list
        targetHandle: target
      - id: edge-list-end
        type: custom
        source: list
        sourceHandle: source
        target: end
        targetHandle: target
    viewport: {x: 0, y: 0, zoom: 1}
