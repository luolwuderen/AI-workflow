app:
  name: Core Chatflow
  description: Start and streamed answer round trip.
  icon: 🤖
  icon_background: '#D3F8DF'
  mode: advanced-chat
  use_icon_as_answer_icon: false
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start
        type: custom
        position: {x: 80, y: 160}
        data:
          desc: ''
          title: User Input
          type: start
          selected: false
          variables:
            - variable: name
              label: Name
              type: text-input
              required: true
            - variable: subscribed
              label: Subscribed
              type: checkbox
              required: false
              default: true
      - id: answer
        type: custom
        position: {x: 420, y: 160}
        data:
          desc: ''
          title: Answer
          type: answer
          selected: false
          answer: 'Hello {{#start.name#}}; subscribed={{#start.subscribed#}}.'
    edges:
      - id: edge-start-answer
        type: custom
        source: start
        sourceHandle: source
        target: answer
        targetHandle: target
    viewport: {x: 12, y: -8, zoom: 1.25}
