services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    tmpfs:
      - /tmp:size=128m,mode=1777,exec
      - /logs:size=16m,mode=1777
      - /var/sandbox:size=256m,mode=1777,exec
    ports:
      - "8194:8194"
    networks: [sandbox-internal, backend]
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: server/platform-app/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/workflow
      DATABASE_USERNAME: workflow
      DATABASE_PASSWORD: workflow
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8081/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local-not-required}
      OPENAI_MODEL: ${OPENAI_MODEL:-default}
      SANDBOX_BASE_URL: http://sandbox:8194
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      SANDBOX_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    networks: [backend, sandbox-internal]

volumes:
  postgres-data:

networks:
  backend:
  sandbox-internal:
    internal: true
